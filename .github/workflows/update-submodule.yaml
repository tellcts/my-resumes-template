name: Update submodules

on:
    schedule:
        # 每天 UTC 02:00（北京时间 10:00）检查子模块是否有新提交
        - cron: "0 2 * * *"
    # 支持在 Actions 页面手动触发
    workflow_dispatch:

permissions:
    contents: write

# 防止多次定时任务重叠执行
concurrency:
    group: update-submodules
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: main
                  fetch-depth: 0
                  submodules: recursive

            - name: Sync submodules to upstream main
              id: sync
              shell: bash
              run: |
                  set -euo pipefail

                  git config user.name  "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  mapfile -t paths < <(
                    git config --file .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}'
                  )
                  if [ "${#paths[@]}" -eq 0 ]; then
                    echo "未找到子模块，跳过。"
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  for path in "${paths[@]}"; do
                    echo "::group::同步 ${path}"
                    git -C "${path}" fetch --prune origin main
                    git -C "${path}" checkout --detach origin/main
                    echo "::endgroup::"
                  done

                  git add -A
                  if git diff --cached --quiet; then
                    echo "子模块均已指向上游最新提交，无需更新。"
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  echo "本次更新的子模块："
                  git diff --cached --submodule=log

                  git commit -m "chore：同步子模块至上游最新状态"
                  echo "changed=true" >> "$GITHUB_OUTPUT"

            - name: Push to main
              if: steps.sync.outputs.changed == 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  for attempt in 1 2 3; do
                    # 先变基到远端最新提交，避免并发推送失败
                    git pull --rebase --autostash origin main
                    if git push origin HEAD:main; then
                      echo "已推送子模块更新到 main。"
                      exit 0
                    fi
                    echo "第 ${attempt} 次推送失败，重试中……"
                    sleep $((attempt * 5))
                  done
                  echo "推送失败，请检查分支保护规则是否允许 GITHUB_TOKEN 推送。" >&2
                  exit 1
